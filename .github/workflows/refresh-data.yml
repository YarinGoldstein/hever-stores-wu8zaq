name: Refresh data snapshot

# Keeps the bundled fallback (data.json) fresh from Hever's public datasets, and
# builds a dated version history — runs on GitHub's infra, no login needed.
on:
  schedule:
    - cron: '17 3 * * 1'   # every Monday 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild data.json from live datasets
        run: node build-data.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "hever-refresh-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "chore: refresh data snapshot ($(date -u +%F))"
            git push
          else
            echo "No changes in data.json."
          fi
